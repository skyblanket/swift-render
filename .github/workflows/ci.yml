name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Smoke-render every scene (one frame each; fails on errors or swish sounds)
        run: swift run swift-render smoke
      - name: Type-check budget (report-only)
        run: scripts/typecheck-budget.sh 300 900
